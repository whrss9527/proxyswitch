name: release

# 推送 v* 标签时：先在 Windows 上跑全部测试，再编译 amd64 和 arm64 两个 exe（版本号取自标签）和安装包，
# 用 CHANGELOG.md 里对应版本的内容创建 GitHub Release 并上传附件。
# 编译前下载 core_config.go 里固定版本的官方 mihomo 内核，把它的 SHA-256 写进程序，Windows 版在程序里下载内核时据此校验。
# 仓库配置了 SignPath（见 docs/signing.md）时，先给两个 exe 签名，用签好的 exe 打安装包，再给安装包签名；没配置时照旧
# 发布没有签名的版本。
# Release 先以草稿创建，附件上传完才发布：程序内更新读取最新发布，不能读到还没有附件的发布。
# 也可以在 Actions 页面手动运行：填已有的标签时重新上传附件；在默认分支上运行、填新的版本号时，先在默认分支的最新提交上
# 打这个标签再发布，不需要在本地推送标签（用 GITHUB_TOKEN 推送的标签不会再触发这个工作流）。
# CI 在合并进 main、发现 CHANGELOG.md 最上面的版本还没有标签时，也是这样在 main 上手动运行它（见 ci.yml）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的标签，例如 v2.1.0；还没有这个标签时在默认分支的最新提交上创建"
        required: true
        type: string

permissions:
  contents: write
  # SignPath 从这次运行的附件里取待签名的文件。
  actions: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  tag:
    name: 准备标签
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 没有这个标签时在默认分支上创建
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::标签要写成 v2.1.0 这样：$TAG"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "标签 $TAG 已经在 $(git rev-parse "$TAG^{commit}")"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] || [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::没有标签 $TAG：新版本只能在默认分支（$DEFAULT_BRANCH）上手动运行时创建"
            exit 1
          fi
          if ! grep -q "^## ${TAG#v}（" CHANGELOG.md; then
            echo "::error::CHANGELOG.md 里没有 ${TAG#v} 这一节，发布说明取自它"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "ProxySwitch $TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          echo "已在 $GITHUB_SHA 上创建标签 $TAG"

  test-windows:
    name: 测试（Windows）
    needs: tag
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: 下载代理内核（订阅相关的测试用）
        shell: bash
        run: |
          VERSION=$(sed -n 's/^const coreVersion = "\(.*\)"$/\1/p' core_config.go)
          curl -fsSL -o "$RUNNER_TEMP/mihomo.zip" "https://github.com/MetaCubeX/mihomo/releases/download/$VERSION/mihomo-windows-amd64-v1-$VERSION.zip"
          unzip -o "$RUNNER_TEMP/mihomo.zip" -d "$RUNNER_TEMP/mihomo"
          mv "$RUNNER_TEMP/mihomo/mihomo-windows-amd64-v1.exe" "$RUNNER_TEMP/mihomo/mihomo.exe"
          echo "PROXYSWITCH_CORE=$(cygpath -w "$RUNNER_TEMP/mihomo/mihomo.exe")" >> "$GITHUB_ENV"
      - name: go vet
        run: go vet ./...
      - name: go test
        env:
          PROXYSWITCH_TEST_REGISTRY: "1"
        run: go test ./...

  build-and-upload:
    name: 编译并发布
    needs: test-windows
    runs-on: ubuntu-latest
    # 同一时间只发一个版本（手动运行和合并后自动发布可能撞在一起）。
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: 下载固定版本的内核并计算校验值
        # 显式用 bash（带 pipefail）：下载失败时让发布中止，而不是发布一个不能在程序里下载内核的版本。
        shell: bash
        run: make -s core-sha256 | tee -a "$GITHUB_ENV"
      - name: 编译 amd64 和 arm64
        run: |
          VERSION="${TAG#v}"
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0
          make resources windows VERSION="$VERSION" CORE_SHA256_AMD64="$CORE_SHA256_AMD64" CORE_SHA256_ARM64="$CORE_SHA256_ARM64" CORE_EXE_SHA256_AMD64="$CORE_EXE_SHA256_AMD64" CORE_EXE_SHA256_ARM64="$CORE_EXE_SHA256_ARM64"
          git archive --format=zip --prefix="proxyswitch-$VERSION/" -o "dist/proxyswitch-$VERSION-src.zip" HEAD
      - name: 上传待签名的程序
        id: unsigned-programs
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-programs
          path: |
            dist/ProxySwitch.exe
            dist/ProxySwitch-arm64.exe
      - name: 签名程序（SignPath）
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: programs
          github-artifact-id: ${{ steps.unsigned-programs.outputs.artifact-id }}
          wait-for-completion: true
          # 签名要在 SignPath 里批准，最多等两小时。
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: dist
      - name: 打安装包
        run: |
          sudo apt-get update && sudo apt-get install -y nsis
          make installer VERSION="${TAG#v}"
      - name: 上传待签名的安装包
        id: unsigned-installer
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: dist/ProxySwitch-Setup.exe
      - name: 签名安装包（SignPath）
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: dist
      - name: 没有签名时提醒
        if: vars.SIGNPATH_ORGANIZATION_ID == ''
        run: echo "::warning::仓库没有配置 SignPath（见 docs/signing.md），这次发布的程序和安装包没有数字签名，Windows 第一次运行时可能提示「已保护你的电脑」。"
      - name: 计算校验值
        run: |
          VERSION="${TAG#v}"
          cd dist && sha256sum ProxySwitch-Setup.exe ProxySwitch.exe ProxySwitch-arm64.exe "proxyswitch-$VERSION-src.zip" > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${TAG#v}"
          awk -v version="$VERSION" '/^## /{ if (printing) exit; if (index($0, version)) { printing = 1; next } } printing' CHANGELOG.md > notes.md
          CORE_VERSION=$(sed -n 's/^const coreVersion = "\(.*\)"$/\1/p' core_config.go)
          printf '\n---\n\n订阅使用的代理内核：[mihomo %s](https://github.com/MetaCubeX/mihomo/releases/tag/%s)。在程序里下载时按下面的 SHA-256 校验：\n\n- x64：`%s`\n- ARM64：`%s`\n' "$CORE_VERSION" "$CORE_VERSION" "$CORE_SHA256_AMD64" "$CORE_SHA256_ARM64" >> notes.md
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "ProxySwitch $TAG" --notes-file notes.md
          fi
          gh release upload "$TAG" dist/ProxySwitch-Setup.exe dist/ProxySwitch.exe dist/ProxySwitch-arm64.exe "dist/proxyswitch-$VERSION-src.zip" dist/SHA256SUMS.txt --clobber
          gh release edit "$TAG" --draft=false --latest
          echo "已发布到 https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"
