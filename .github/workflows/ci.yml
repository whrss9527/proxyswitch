name: ci

# 推送代码和合并请求时运行：Linux 上跑单元测试和设置页的浏览器测试，Windows 上跑包括修改系统设置在内的全部测试，
# macOS 上编译、测试并打包 macOS 版（macos/ 目录，Swift）。
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  linux:
    name: 单元测试和设置页测试（Linux）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: 静态检查（Linux 和 Windows 两个平台）
        run: make vet
      - name: 单元测试
        run: go test ./...
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 Playwright 和中文字体
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: 设置页测试
        run: python tools/ui_test.py ui-screenshots
      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: ui-screenshots

  macos:
    name: macOS 版（Swift）
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      - name: 选择最新的 Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$latest"
          xcodebuild -version
          swift --version
      - name: 编译
        run: swift build
      - name: 单元测试
        run: swift test
      - name: 打包 .app（本机架构）
        run: VERSION=0.0.0 ARCHS="" Scripts/build-app.sh
      - name: 冒烟启动并截图
        run: |
          support="$HOME/Library/Application Support/ProxySwitch"
          mkdir -p "$support" screenshots
          # 预置两套配置，面板里有内容可看。
          cat > "$support/config.json" <<'JSON'
          {"profiles":[{"id":"6D2F2A1E-0000-4000-8000-000000000001","name":"Clash","color":"#16a34a","kind":"http","host":"127.0.0.1","port":7890},
                       {"id":"6D2F2A1E-0000-4000-8000-000000000002","name":"公司代理","color":"#2563eb","kind":"http","host":"proxy.corp.example","port":3128},
                       {"id":"6D2F2A1E-0000-4000-8000-000000000003","name":"SOCKS 隧道","color":"#7c3aed","kind":"socks5","host":"127.0.0.1","port":1080}]}
          JSON
          open dist/ProxySwitch.app
          sleep 8
          if ! pgrep -x ProxySwitch >/dev/null; then
            echo "程序没有在运行"
            cat "$support/proxyswitch.log" || true
            exit 1
          fi
          open "proxyswitch://panel"; sleep 3
          screencapture -x screenshots/panel.png || true
          open "proxyswitch://settings"; sleep 4
          screencapture -x screenshots/settings.png || true
          cat "$support/proxyswitch.log" || true
          pkill -x ProxySwitch || true
          ls -la screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: ProxySwitch-macos
          path: macos/dist/ProxySwitch-macos.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-screenshots
          path: macos/screenshots
      - name: 把截图以 base64 打进日志（产物下载受限的环境也能看）
        if: always()
        run: |
          cd screenshots || exit 0
          if [ -f panel.png ]; then
            width=$(sips -g pixelWidth panel.png | awk '/pixelWidth/{print $2}')
            height=$(sips -g pixelHeight panel.png | awk '/pixelHeight/{print $2}')
            echo "panel.png: ${width}x${height}"
            cropw=640; croph=760
            if ! sips -c "$croph" "$cropw" --cropOffset 0 $((width - cropw)) panel.png --out panel-crop.png >/dev/null 2>&1; then
              cp panel.png panel-crop.png
            fi
            sips -s format jpeg -s formatOptions 75 panel-crop.png --out panel.jpg >/dev/null
          fi
          if [ -f settings.png ]; then
            sips -Z 1400 -s format jpeg -s formatOptions 70 settings.png --out settings.jpg >/dev/null
          fi
          for name in panel settings; do
            [ -f "$name.jpg" ] || continue
            echo "=====BEGIN $name.jpg====="
            base64 -b 76 -i "$name.jpg"
            echo "=====END $name.jpg====="
          done

  windows:
    name: 全部测试（Windows）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: go vet
        run: go vet ./...
      - name: go test（包括修改系统代理和环境变量的测试，结束后恢复）
        env:
          PROXYSWITCH_TEST_REGISTRY: "1"
        run: go test -v ./...
